[project]
name = "apex-trading"
version = "0.1.0"
description = "Fail-closed autonomous Kalshi weather research and paper-trading system"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0",
    "numpy>=2.4.2",
    "openai>=2.26.0",
    "pydantic-settings>=2.13.1",
    "python-telegram-bot[job-queue]>=22.5",
    "requests>=2.32.0",
]

[project.scripts]
apex-weather = "src.weather_cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "alpaca-py>=0.43.2",
    "anthropic>=0.84.0",
    "apscheduler>=3.11.2",
    "duckdb>=1.4.4",
    "httpx>=0.28.1",
    "lightgbm>=4.6.0",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "streamlit>=1.55.0",
    "vectorbt>=0.28.4",
    "yfinance>=1.2.0",
]
